name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: "Kamal command to run"
        type: choice
        options: [deploy, setup, rollback]
        default: setup

# Default GITHUB_TOKEN scopes:
# - contents:read   to checkout
# - packages:write  to push the image to GHCR
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      # Kamal reads .kamal/secrets at deploy time and substitutes $VAR
      # references from this env block. Optional secrets (Sentry, Google,
      # Resend) can be unset in GH Secrets and will deploy as empty strings.
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SESSION_KEY: ${{ secrets.SESSION_KEY }}
      NASDAQ_API_KEY: ${{ secrets.NASDAQ_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are set
        # Fail fast before we provision anything if a required secret is
        # missing or empty. Cheaper than discovering it after a half-built
        # deploy. Optional secrets (SENTRY_DSN, GOOGLE_*, RESEND_API_KEY)
        # are intentionally not checked — empty values are valid.
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
          KAMAL_SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          for var in \
              KAMAL_SSH_PRIVATE_KEY \
              KAMAL_SSH_KNOWN_HOSTS \
              DATABASE_URL \
              POSTGRES_PASSWORD \
              SESSION_KEY \
              NASDAQ_API_KEY \
              TIINGO_API_KEY; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "Set them at Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "All required secrets present."

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal -v "~> 2"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Pin deploy host's public keys
        # Pinned from a vetted source (the GH Secret, populated by you
        # once via `ssh-keyscan` on a trusted machine + verifying against
        # Hetzner's console). Any mismatch on connection is a real signal,
        # not a CI hiccup.
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KAMAL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          KAMAL_SSH_KNOWN_HOSTS: ${{ secrets.KAMAL_SSH_KNOWN_HOSTS }}

      - name: Materialize Kamal secrets file
        # Kamal expects .kamal/secrets to exist; we render the committed
        # template (which uses $VAR refs) into the gitignored real file.
        run: |
          mkdir -p .kamal
          cp .kamal/secrets.example .kamal/secrets

      - name: Run Kamal
        # Default to `setup` for both push and workflow_dispatch.
        # `setup` is idempotent: on a configured host it's basically
        # equivalent to `deploy` plus a fast accessory-state check.
        # The price (~10s) buys us "first deploy on a fresh box also works."
        run: |
          CMD="${{ inputs.command || 'setup' }}"
          echo "Running: kamal $CMD"
          kamal "$CMD"
