name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default GITHUB_TOKEN gives write access to the repo; none of these
# jobs publish anything or comment on PRs, so scope down to read-only.
permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  generated-go-fresh:
    name: generated-go-fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install pinned generators
        run: |
          go install github.com/a-h/templ/cmd/templ
          go install github.com/swaggo/swag/cmd/swag
      - name: regenerate
        run: |
          templ generate
          swag init -g cmd/app/main.go --parseDependency --parseInternal
      - name: assert no diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Committed generated Go files are stale. Run 'make tools && templ generate && swag init -g cmd/app/main.go --parseDependency --parseInternal' locally and commit the result."
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: value_user
          POSTGRES_PASSWORD: value_pass
          POSTGRES_DB: value_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U value_user -d value_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://value_user:value_pass@localhost:5432/value_db?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: compile
        run: go build -o /tmp/app ./cmd/app
