name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: "Kamal command to run"
        type: choice
        options: [deploy, setup, rollback]
        default: deploy

# Default GITHUB_TOKEN scopes:
# - contents:read   to checkout
# - packages:write  to push the image to GHCR
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      # Kamal reads .kamal/secrets at deploy time and substitutes $VAR
      # references from this env block. Optional secrets (Sentry, Google,
      # Resend) can be unset in GH Secrets and will deploy as empty strings.
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SESSION_KEY: ${{ secrets.SESSION_KEY }}
      NASDAQ_API_KEY: ${{ secrets.NASDAQ_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal -v "~> 2"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Trust deploy host
        run: ssh-keyscan -H box.utiger.dk >> ~/.ssh/known_hosts

      - name: Materialize Kamal secrets file
        # Kamal expects .kamal/secrets to exist; we render the committed
        # template (which uses $VAR refs) into the gitignored real file.
        run: |
          mkdir -p .kamal
          cp .kamal/secrets.example .kamal/secrets

      - name: Run Kamal
        run: |
          CMD="${{ inputs.command || 'deploy' }}"
          echo "Running: kamal $CMD"
          kamal "$CMD"
